<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta name="theme-color" content="{{SITE_THEME_COLOR}}" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- link preview (WhatsApp, iMessage, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:image" content="{{SITE_OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap"
    />
  </head>
  <body>
    <!-- the living painting (layers are generated in src/scene) -->
    <div class="scene" aria-hidden="true"><div class="scene__inner" id="scene"></div></div>
    <canvas class="ambient" id="ambient" aria-hidden="true"></canvas>
    <!-- light rays, edge vignette, canvas grain and craquelure: one static layer -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <!-- all visible text is filled in from src/config.ts -->
    <main class="content">
      <section class="hero" id="hero">
        <div class="hero__title">
          <p class="caption" data-text="caption"></p>
          <h1 class="name" data-text="name"></h1>
          <svg class="flourish" viewBox="0 0 300 30" aria-hidden="true" focusable="false">
            <path pathLength="1" d="M8 16C40 4 74 26 112 15C128 10 138 9 146 14" fill="none" stroke="#a8822f" stroke-width="1.4" stroke-linecap="round" />
            <path pathLength="1" d="M292 16C260 4 226 26 188 15C172 10 162 9 154 14" fill="none" stroke="#a8822f" stroke-width="1.4" stroke-linecap="round" />
            <g class="gem">
              <path d="M150 7L156 15L150 23L144 15Z" fill="#c9a24b" />
              <circle cx="150" cy="15" r="2.6" fill="#7a2232" />
            </g>
          </svg>
        </div>
        <button class="tilt" id="tilt" type="button" data-text="tiltInvite" hidden></button>
        <a class="scroll-hint" href="#poem">
          <span data-text="scrollHint"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </section>

      <section class="poem" id="poem">
        <div class="card poem__card">
          <svg class="fleuron" viewBox="0 0 120 24" aria-hidden="true" focusable="false">
            <path d="M60 12C52 2 40 4 36 12C32 20 20 20 14 13M60 12C68 2 80 4 84 12C88 20 100 20 106 13" fill="none" stroke="#b18a35" stroke-width="1.3" stroke-linecap="round" />
            <path d="M60 4C64 8 64 16 60 20C56 16 56 8 60 4Z" fill="#c9a24b" />
            <circle cx="10" cy="12" r="2" fill="#c9a24b" />
            <circle cx="110" cy="12" r="2" fill="#c9a24b" />
          </svg>
          <ol class="poem__lines" id="poemLines"></ol>
          <p class="poem__signature" data-text="signature"></p>
        </div>
      </section>

      <section class="wish">
        <button class="wish__button" id="wishButton" type="button" data-text="wishButton"></button>
        <p class="wish__card card" id="wishCard" aria-live="polite"></p>
      </section>

      <footer class="footer">
        <span data-text="footer"></span> <span class="footer__emoji" data-text="footerEmoji"></span>
      </footer>
    </main>

    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="frame" id="frame" aria-hidden="true"></div>
    <button class="music" id="music" type="button" hidden></button>

    <div class="curtain" id="curtain" aria-hidden="true">
      <div class="curtain__inner">
        <svg class="curtain__crown" viewBox="0 0 64 40" focusable="false">
          <defs>
            <linearGradient id="crownGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8a6a24" /><stop offset=".35" stop-color="#e9cf7a" />
              <stop offset=".6" stop-color="#c9a24b" /><stop offset="1" stop-color="#9c7a2e" />
            </linearGradient>
          </defs>
          <path d="M6 34L3 12L18 22L32 4L46 22L61 12L58 34Z" fill="url(#crownGold)" />
          <rect x="6" y="33" width="52" height="5" rx="1.5" fill="url(#crownGold)" />
          <circle cx="3" cy="11" r="2.6" fill="#fbf4e6" /><circle cx="32" cy="4" r="3" fill="#fbf4e6" /><circle cx="61" cy="11" r="2.6" fill="#fbf4e6" />
          <ellipse cx="32" cy="25" rx="3.4" ry="4.6" fill="#7a2232" />
        </svg>
        <span class="curtain__label" data-text="curtainLabel"></span>
      </div>
    </div>

    <noscript><p style="position:relative;z-index:200;padding:2rem;text-align:center;font-family:Georgia,serif">Bu tabloyu canlandırmak için JavaScript gerekiyor.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
